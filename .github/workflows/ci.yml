name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m bandit -r src
      - run: python tools/make_release.py --audit-git
      - run: python tools/make_release.py
      - name: Audit dependencies
        if: matrix.os == 'windows-latest' && matrix.python == '3.12'
        run: python -m pip_audit
      - name: Build and install wheel
        run: |
          python -m build
          python -m venv wheel-check
      - name: Check installed wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter '*.whl' | Select-Object -First 1
          & .\wheel-check\Scripts\python.exe -m pip install --no-deps $wheel.FullName
          Set-Location wheel-check
          & .\Scripts\python.exe -m subdav --check
      - name: Check installed wheel on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd wheel-check
          bin/python -m subdav --check
