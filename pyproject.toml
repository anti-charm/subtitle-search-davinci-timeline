[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subdav"
version = "0.2.1"
description = "Search SRT subtitles and export matching clips as a DaVinci Resolve FCPXML timeline"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "anti-charm"}]
dependencies = []

[project.urls]
Repository = "https://github.com/anti-charm/subtitle-search-davinci-timeline"
Issues = "https://github.com/anti-charm/subtitle-search-davinci-timeline/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE001"]
